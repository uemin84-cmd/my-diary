<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#f4a7b9">
<link rel="manifest" href="/manifest.json">
<title>가계부 💰</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #faf9f6; --bg2: #f4f3f0; --card: #ffffff;
  --border: #e8e4de; --accent: #e8839a; --accent2: #f4a7b9;
  --text: #2d2d2d; --sub: #9a9490; --sub2: #b8b4ae; --radius: 18px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --income: #4a8fd6; --expense: #e06c7f;
}
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', -apple-system, sans-serif; min-height: 100vh; padding: 0 0 100px; }
header { background: var(--card); padding: 52px 20px 20px; border-bottom: 1px solid var(--border); text-align: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 8px rgba(0,0,0,0.04); }
.date-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg2); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--sub); margin-bottom: 8px; font-weight: 500; }
header h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
header h1 span { color: var(--accent); }
.content { padding: 20px 16px; }
.card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.card-label { font-size: 11px; font-weight: 700; color: var(--sub); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.card-label .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; }
input[type="text"], input[type="date"], input[type="url"], input[type="password"] { width: 100%; background: var(--bg2); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; font-size: 15px; padding: 12px 14px; outline: none; transition: border-color 0.15s, background 0.15s; -webkit-appearance: none; }
input:focus { border-color: var(--accent2); background: #fff; }
input::placeholder { color: var(--sub2); }
.type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type-btn { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--sub); font-family: inherit; -webkit-appearance: none; }
.type-btn.selected[data-type="지출"] { border-color: var(--expense); color: var(--expense); background: #fdf0f2; }
.type-btn.selected[data-type="수입"] { border-color: var(--income); color: var(--income); background: #eff5fc; }
.amount-wrap { position: relative; }
.amount-wrap input { font-size: 24px; font-weight: 700; padding-right: 44px; text-align: right; }
.amount-wrap .won { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--sub); font-weight: 600; }
.chip-grid { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 20px; padding: 8px 13px; font-size: 13px; cursor: pointer; color: var(--text); font-family: inherit; font-weight: 500; -webkit-appearance: none; }
.chip.selected { border-color: var(--accent); background: #fdf0f3; color: var(--accent); font-weight: 700; }
.submit-btn { width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 16px; color: #fff; font-size: 15px; font-weight: 700; padding: 17px; cursor: pointer; margin-top: 8px; font-family: inherit; box-shadow: 0 4px 16px rgba(232,131,154,0.3); }
.submit-btn:active { opacity: 0.88; }
.ghost-btn { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; color: var(--text); font-size: 14px; font-weight: 600; padding: 13px; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); }
.settings-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); cursor: pointer; margin-bottom: 12px; padding: 11px 14px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); font-weight: 500; box-shadow: var(--shadow); }
.settings-panel { display: none; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.settings-panel.open { display: flex; }
.hint { font-size: 11px; color: var(--sub2); margin-top: 8px; line-height: 1.7; }
.sync-status { font-size: 12px; color: var(--sub); margin-left: auto; }
.month-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
.month-nav button { background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 34px; height: 34px; font-size: 16px; cursor: pointer; color: var(--sub); }
.month-nav strong { font-size: 17px; min-width: 110px; text-align: center; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.summary .box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); }
.summary .box span { display: block; font-size: 11px; color: var(--sub); font-weight: 600; margin-bottom: 4px; }
.summary .box b { font-size: 14px; word-break: keep-all; }
.income { color: var(--income); }
.expense { color: var(--expense); }
.day-group { margin-bottom: 14px; }
.day-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); font-weight: 600; padding: 0 4px 6px; }
.tx { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 6px; box-shadow: var(--shadow); }
.tx .info { flex: 1; min-width: 0; }
.tx .cat { font-size: 14px; font-weight: 600; }
.tx .meta { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .amt { font-size: 15px; font-weight: 700; white-space: nowrap; }
.tx .del { background: none; border: none; color: var(--sub2); font-size: 16px; cursor: pointer; padding: 4px; }
.tx .unsynced { font-size: 10px; color: var(--accent); font-weight: 700; }
.bar-row { margin-bottom: 12px; }
.bar-row .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.bar-row .top span:last-child { color: var(--sub); }
.bar { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
.bar div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; }
.empty-state { text-align: center; color: var(--sub); padding: 50px 0; font-size: 15px; line-height: 2; }
.page { display: none; }
.page.active { display: block; }
.bottom-tab { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; padding: 8px 0 24px; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); }
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--sub2); cursor: pointer; padding: 6px 0; border: none; background: transparent; transition: color 0.15s; font-family: inherit; font-weight: 600; text-decoration: none; }
.tab-btn .tab-icon { font-size: 21px; }
.tab-btn.active { color: var(--accent); }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--text); border-radius: 24px; padding: 12px 22px; font-size: 13px; font-weight: 600; color: #fff; opacity: 0; transition: all 0.35s; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="page active" id="page-add">
  <header>
    <div class="date-chip">💰 <span id="date-display"></span></div>
    <h1>오늘의 <span>가계부</span></h1>
  </header>
  <div class="content">
    <div class="settings-toggle" onclick="toggleSettings()">
      ⚙️ 구글 시트 연동 설정 <span class="sync-status" id="sync-status"></span> <span style="font-size:15px;">›</span>
    </div>
    <div class="settings-panel" id="settings-panel">
      <div class="card">
        <div class="card-label"><div class="dot"></div>Apps Script 웹 앱 URL</div>
        <input type="url" id="gas-url" placeholder="https://script.google.com/macros/s/xxxx/exec" oninput="saveSettings()">
        <div class="card-label" style="margin-top:14px;"><div class="dot"></div>비밀 키 (선택)</div>
        <input type="password" id="gas-token" placeholder="Code.gs의 TOKEN과 같은 값" oninput="saveSettings()">
        <p class="hint">구글 시트 → 확장 프로그램 → Apps Script에 Code.gs를 붙여넣고<br>배포 → 새 배포 → 웹 앱(액세스: 모든 사용자) → URL 복사</p>
        <button class="ghost-btn" style="margin-top:12px;" onclick="syncAll(true)">🔄 지금 동기화</button>
      </div>
    </div>

    <div class="card">
      <div class="type-toggle">
        <button class="type-btn selected" data-type="지출" onclick="selectType(this)">지출</button>
        <button class="type-btn" data-type="수입" onclick="selectType(this)">수입</button>
      </div>
    </div>
    <div class="card">
      <div class="card-label"><div class="dot"></div>금액</div>
      <div class="amount-wrap">
        <input type="text" id="amount" inputmode="numeric" placeholder="0" oninput="formatAmount(this)">
        <span class="won">원</span>
      </div>
    </div>
    <div class="card">
      <div class="card-label"><div class="dot" style="background:#a8c5da;"></div>카테고리</div>
      <div class="chip-grid" id="category-chips"></div>
    </div>
    <div class="card" id="method-card">
      <div class="card-label"><div class="dot" style="background:#c5b8e0;"></div>결제수단</div>
      <div class="chip-grid" id="method-chips"></div>
    </div>
    <div class="card">
      <div class="card-label"><div class="dot" style="background:#a8d5b5;"></div>날짜</div>
      <input type="date" id="tx-date">
    </div>
    <div class="card">
      <div class="card-label"><div class="dot" style="background:#f4c89a;"></div>메모</div>
      <input type="text" id="memo" placeholder="어디서 / 무엇을">
    </div>
    <button class="submit-btn" onclick="addEntry()">기록하기 ✨</button>
  </div>
</div>

<div class="page" id="page-list">
  <header>
    <div class="date-chip">📒 내역</div>
    <h1>월별 <span>내역</span></h1>
  </header>
  <div class="content">
    <div class="month-nav">
      <button onclick="moveMonth(-1)">‹</button>
      <strong class="month-label"></strong>
      <button onclick="moveMonth(1)">›</button>
    </div>
    <div class="summary" id="list-summary"></div>
    <div id="tx-list"></div>
  </div>
</div>

<div class="page" id="page-stats">
  <header>
    <div class="date-chip">📊 통계</div>
    <h1>카테고리별 <span>지출</span></h1>
  </header>
  <div class="content">
    <div class="month-nav">
      <button onclick="moveMonth(-1)">‹</button>
      <strong class="month-label"></strong>
      <button onclick="moveMonth(1)">›</button>
    </div>
    <div class="summary" id="stats-summary"></div>
    <div class="card" id="category-bars"></div>
  </div>
</div>

<div class="bottom-tab">
  <button class="tab-btn active" onclick="switchTab('add', this)"><span class="tab-icon">✏️</span>기록</button>
  <button class="tab-btn" onclick="switchTab('list', this)"><span class="tab-icon">📒</span>내역</button>
  <button class="tab-btn" onclick="switchTab('stats', this)"><span class="tab-icon">📊</span>통계</button>
  <a class="tab-btn" href="/index.html"><span class="tab-icon">📓</span>일기</a>
</div>

<div class="toast" id="toast"></div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

const CATEGORIES = {
  '지출': ['식비', '카페·간식', '교통', '쇼핑', '생활용품', '주거·통신', '의료·건강', '문화·여가', '교육', '경조사', '기타'],
  '수입': ['급여', '부수입', '용돈', '금융수입', '기타']
};
const METHODS = ['카드', '현금', '계좌이체', '간편결제'];
const days = ['일','월','화','수','목','금','토'];

function localDate(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const now = new Date();
document.getElementById('date-display').textContent =
  `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
document.getElementById('tx-date').value = localDate();

// ---------- 저장소 ----------
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));
let entries = load('budget_entries', []);
let pendingDeletes = load('budget_pending_deletes', []);
const persist = () => { store('budget_entries', entries); store('budget_pending_deletes', pendingDeletes); };

// ---------- 입력 폼 ----------
let selectedType = '지출', selectedCategory = '', selectedMethod = '카드';

function renderChips() {
  document.getElementById('category-chips').innerHTML = CATEGORIES[selectedType].map(c =>
    `<button class="chip${c === selectedCategory ? ' selected' : ''}" onclick="selectCategory('${c}')">${c}</button>`).join('');
  document.getElementById('method-chips').innerHTML = METHODS.map(m =>
    `<button class="chip${m === selectedMethod ? ' selected' : ''}" onclick="selectMethod('${m}')">${m}</button>`).join('');
  document.getElementById('method-card').style.display = selectedType === '지출' ? '' : 'none';
}
function selectType(btn) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedType = btn.dataset.type;
  selectedCategory = '';
  renderChips();
}
function selectCategory(c) { selectedCategory = c; renderChips(); }
function selectMethod(m) { selectedMethod = m; renderChips(); }
function formatAmount(el) {
  const n = el.value.replace(/[^0-9]/g, '');
  el.value = n ? Number(n).toLocaleString('ko-KR') : '';
}
renderChips();

async function addEntry() {
  const amount = Number(document.getElementById('amount').value.replace(/[^0-9]/g, ''));
  const date = document.getElementById('tx-date').value;
  if (!amount) { showToast('금액을 입력해 주세요'); return; }
  if (!selectedCategory) { showToast('카테고리를 골라 주세요'); return; }
  if (!date) { showToast('날짜를 골라 주세요'); return; }

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    date, type: selectedType, category: selectedCategory, amount,
    method: selectedType === '지출' ? selectedMethod : '',
    memo: document.getElementById('memo').value.trim(),
    synced: false
  };
  entries.push(entry);
  persist();

  document.getElementById('amount').value = '';
  document.getElementById('memo').value = '';
  selectedCategory = '';
  renderChips();

  if (!getUrl()) { showToast('✅ 기기에 저장했어요 (시트 미연동)'); return; }
  const ok = await pushEntry(entry);
  showToast(ok ? '✅ 구글 시트에 저장했어요!' : '✅ 기기에 저장했어요 (나중에 전송)');
  updateSyncStatus();
}

// ---------- 구글 시트 통신 ----------
function getUrl() { return (localStorage.getItem('budget_gas_url') || '').trim(); }
function getToken() { return localStorage.getItem('budget_token') || ''; }

// Content-Type을 text/plain으로 보내야 Apps Script에서 CORS 사전요청 없이 동작합니다.
async function postToSheet(payload) {
  const res = await fetch(getUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: getToken(), ...payload })
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error);
  return data;
}

async function pushEntry(entry) {
  try {
    const { synced, ...data } = entry;
    await postToSheet({ action: 'add', entry: data });
    entry.synced = true;
    persist();
    return true;
  } catch (e) {
    console.warn('시트 전송 실패', e);
    return false;
  }
}

async function syncAll(manual = false) {
  if (!getUrl()) { if (manual) showToast('먼저 웹 앱 URL을 입력해 주세요'); return; }
  try {
    for (const id of [...pendingDeletes]) {
      await postToSheet({ action: 'delete', id });
      pendingDeletes = pendingDeletes.filter(x => x !== id);
      persist();
    }
    for (const e of entries.filter(e => !e.synced)) {
      await postToSheet({ action: 'add', entry: (({ synced, ...d }) => d)(e) });
      e.synced = true;
      persist();
    }
    const url = new URL(getUrl());
    if (getToken()) url.searchParams.set('token', getToken());
    const data = await (await fetch(url)).json();
    if (!data.ok) throw new Error(data.error);
    // 시트가 기준: 시트 내용 + 아직 전송 못 한 로컬 기록
    const unsynced = entries.filter(e => !e.synced);
    entries = [...data.rows.map(r => ({ ...r, synced: true })), ...unsynced];
    persist();
    localStorage.setItem('budget_last_sync', new Date().toISOString());
    if (manual) showToast('🔄 동기화 완료!');
  } catch (e) {
    console.warn('동기화 실패', e);
    if (manual) showToast('⚠️ 동기화 실패: ' + e.message);
  }
  updateSyncStatus();
  renderList();
  renderStats();
}

async function deleteEntry(id) {
  const entry = entries.find(e => e.id === id);
  if (!entry || !confirm(`${entry.category} ${won(entry.amount)} 기록을 삭제할까요?`)) return;
  entries = entries.filter(e => e.id !== id);
  if (entry.synced) pendingDeletes.push(id);
  persist();
  renderList();
  renderStats();
  if (entry.synced && getUrl()) {
    try {
      await postToSheet({ action: 'delete', id });
      pendingDeletes = pendingDeletes.filter(x => x !== id);
      persist();
    } catch (e) { console.warn('시트 삭제 실패', e); }
  }
  updateSyncStatus();
}

// ---------- 설정 ----------
function saveSettings() {
  localStorage.setItem('budget_gas_url', document.getElementById('gas-url').value.trim());
  localStorage.setItem('budget_token', document.getElementById('gas-token').value);
  updateSyncStatus();
}
function toggleSettings() { document.getElementById('settings-panel').classList.toggle('open'); }
function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!getUrl()) { el.textContent = '미연동'; return; }
  const waiting = entries.filter(e => !e.synced).length + pendingDeletes.length;
  el.textContent = waiting ? `전송 대기 ${waiting}건` : '연동됨 ✅';
}
document.getElementById('gas-url').value = getUrl();
document.getElementById('gas-token').value = getToken();

// ---------- 내역 / 통계 ----------
let viewMonth = new Date(now.getFullYear(), now.getMonth(), 1);
const monthKey = () => `${viewMonth.getFullYear()}-${String(viewMonth.getMonth()+1).padStart(2,'0')}`;
const monthEntries = () => entries.filter(e => e.date.startsWith(monthKey()));

function moveMonth(diff) {
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + diff, 1);
  renderList();
  renderStats();
}

function summaryHtml(list) {
  const inc = list.filter(e => e.type === '수입').reduce((s, e) => s + e.amount, 0);
  const exp = list.filter(e => e.type === '지출').reduce((s, e) => s + e.amount, 0);
  return `
    <div class="box"><span>수입</span><b class="income">${won(inc)}</b></div>
    <div class="box"><span>지출</span><b class="expense">${won(exp)}</b></div>
    <div class="box"><span>합계</span><b>${won(inc - exp)}</b></div>`;
}

function renderList() {
  document.querySelectorAll('.month-label').forEach(el =>
    el.textContent = `${viewMonth.getFullYear()}년 ${viewMonth.getMonth()+1}월`);
  const list = monthEntries();
  document.getElementById('list-summary').innerHTML = summaryHtml(list);
  const box = document.getElementById('tx-list');
  if (!list.length) {
    box.innerHTML = '<div class="empty-state">이번 달 기록이 없어요 🌱</div>';
    return;
  }
  const byDate = {};
  list.forEach(e => (byDate[e.date] ||= []).push(e));
  box.innerHTML = Object.keys(byDate).sort().reverse().map(date => {
    const d = new Date(date + 'T00:00:00');
    const exp = byDate[date].filter(e => e.type === '지출').reduce((s, e) => s + e.amount, 0);
    return `<div class="day-group">
      <div class="day-head"><span>${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})</span>${exp ? `<span>지출 ${won(exp)}</span>` : ''}</div>
      ${byDate[date].map(e => `
        <div class="tx">
          <div class="info">
            <div class="cat">${esc(e.category)} ${e.synced ? '' : '<span class="unsynced">전송 대기</span>'}</div>
            <div class="meta">${esc([e.method, e.memo].filter(Boolean).join(' · '))}</div>
          </div>
          <div class="amt ${e.type === '수입' ? 'income' : 'expense'}">${e.type === '수입' ? '+' : '-'}${won(e.amount)}</div>
          <button class="del" onclick="deleteEntry('${esc(e.id)}')">✕</button>
        </div>`).join('')}
    </div>`;
  }).join('');
}

function renderStats() {
  const list = monthEntries();
  document.getElementById('stats-summary').innerHTML = summaryHtml(list);
  const exp = list.filter(e => e.type === '지출');
  const total = exp.reduce((s, e) => s + e.amount, 0);
  const box = document.getElementById('category-bars');
  if (!total) {
    box.innerHTML = '<div class="empty-state" style="padding:30px 0;">이번 달 지출이 없어요</div>';
    return;
  }
  const byCat = {};
  exp.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
  box.innerHTML = '<div class="card-label"><div class="dot"></div>지출 비중</div>' +
    Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([cat, amt]) => {
      const pct = Math.round(amt / total * 100);
      return `<div class="bar-row">
        <div class="top"><span>${esc(cat)}</span><span>${won(amt)} · ${pct}%</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
}

function switchTab(tab, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  btn.classList.add('active');
  if (tab === 'list') renderList();
  if (tab === 'stats') renderStats();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

renderList();
updateSyncStatus();
syncAll();
</script>
</body>
</html>
